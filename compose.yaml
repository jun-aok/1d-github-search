# 実行基盤はすべて Docker Compose（docs/design.md 6 節）
# development: docker compose up app
# 擬似本番:     GITHUB_TOKEN=... docker compose --profile prod up
# E2E:          docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e e2e
services:
  # development。ソースをマウントし next dev。lint / typecheck / 単体テストもこのサービスで実行する
  app:
    image: node:24
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      GITHUB_CLIENT: ${GITHUB_CLIENT:-http}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CI: ${CI:-}

  # production イメージ。擬似本番（prod）と E2E（e2e）は同じイメージで環境変数だけが違う
  app-prod:
    build:
      context: .
      args:
        GITHUB_CLIENT: ${GITHUB_CLIENT:-http}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      GITHUB_CLIENT: ${GITHUB_CLIENT:-http}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    profiles: ["prod"]

  app-e2e:
    build:
      context: .
      args:
        GITHUB_CLIENT: fake
    environment:
      NODE_ENV: production
      GITHUB_CLIENT: fake
    profiles: ["e2e"]

  # E2E ランナー。app-e2e（fake の GitHub）に向けて Playwright を実行する
  e2e:
    image: mcr.microsoft.com/playwright:v1.59.0-noble
    working_dir: /app
    command: sh -c "npm ci && npx playwright test"
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    environment:
      BASE_URL: http://app-e2e:3000
      CI: "true"
    depends_on:
      app-e2e:
        condition: service_healthy
    profiles: ["e2e"]

volumes:
  node_modules:
  next_cache:
  e2e_node_modules:
